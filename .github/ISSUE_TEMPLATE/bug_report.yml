name: Bug report
description: Something in a CLI, a renderer, or the board does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For anything security-sensitive, please follow
        [SECURITY.md](../blob/main/SECURITY.md) instead of opening a public issue.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the project is affected?
      options:
        - maggie CLI (skill push)
        - maggie workspace CLI (bootstrap / status)
        - Board dashboard or server
        - Skills library (skills/)
        - Renderers (claude / copilot / cursor / windsurf)
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, including the full command and any error output.
      placeholder: |
        $ node apps/board/bin/maggie.js sync --config repos.example.json --dry-run
        …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal config (with private URLs redacted) helps a lot.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0, or the commit SHA you are on"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and Node version (`node -v`).
      placeholder: "macOS 15.3, Node 22.11.0"
    validations:
      required: true
