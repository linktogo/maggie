version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nx:
        patterns:
          - "@nx/*"
          - "nx"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 is the native rewrite. Its npm package no longer exports
      # the classic compiler API — `typescript`'s main entry is now just
      # `{ version, versionMajorMinor }`, everything else moved behind
      # `typescript/unstable/*`. Nx's project-graph plugins still call
      # `ts.readConfigFile`, so on TS 7 the graph fails to process and every
      # target dies with "ts.readConfigFile is not a function". Nothing in this
      # repo is written in TypeScript, so there is nothing to gain from the
      # bump until Nx ships TS 7 support — see "Dependency holds" in
      # CONTRIBUTING.md.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
