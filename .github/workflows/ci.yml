name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Nx (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6 # version from package.json `packageManager`
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec nx run-many -t lint
      - name: Check every project enforces a 100% coverage gate
        run: pnpm run check:coverage
      - name: Test (100% coverage gate per project)
        run: pnpm exec nx run-many -t test
      - name: Test release scripts
        run: pnpm run test:scripts
      - name: Build
        run: pnpm exec nx run-many -t build
