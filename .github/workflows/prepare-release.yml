name: Prepare release

# On every push to main this either opens/updates the `chore(release):
# vX.Y.Z` PR (when new feat/fix commits landed) or, once that PR is merged,
# pushes the release tag for the version it bumped to — see "Tagging and
# publishing" in CONTRIBUTING.md.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      # Checks out with RELEASE_PAT rather than the default GITHUB_TOKEN: the
      # release tag is pushed from this checkout, and creating `v*` tags is
      # restricted to the Admin role (scripts/setup-release-protections.sh),
      # which `github-actions[bot]` does not hold. The token has to be supplied
      # here and not at push time — actions/checkout persists it as an
      # `http.extraheader` for github.com, and that header takes precedence
      # over any credentials embedded in a push URL.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Detect bump type from commits since last tag
        id: detect
        run: node scripts/detect-bump-type.js >> "$GITHUB_OUTPUT"

      - name: Bump version
        if: steps.detect.outputs.type != 'none'
        # Step outputs reach the shell through env, never by expanding `${{ }}`
        # inside `run:`, so they can only ever be data.
        env:
          BUMP_TYPE: ${{ steps.detect.outputs.type }}
        run: node scripts/bump-version.js "$BUMP_TYPE"

      - name: Read new version
        if: steps.detect.outputs.type != 'none'
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open or update release PR
        if: steps.detect.outputs.type != 'none'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/release-next
          commit-message: "chore(release): v${{ steps.version.outputs.version }}"
          title: "chore(release): v${{ steps.version.outputs.version }}"
          body: >-
            Automated ${{ steps.detect.outputs.type }} version bump to
            v${{ steps.version.outputs.version }}, computed from commits since
            the last release tag.${{ steps.detect.outputs.breaking == 'true' &&
            ' **Warning:** a breaking-change commit was detected — consider
            closing this PR and running `node scripts/bump-version.js major`
            instead.' || '' }}
          labels: release

      - name: Check if a release tag is pending
        id: pending
        run: node scripts/should-tag-release.js >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        if: steps.pending.outputs.pending == 'true'
        env:
          TAG: ${{ steps.pending.outputs.tag }}
        run: |
          tag="$TAG"
          git tag "$tag"
          git push origin "$tag"
