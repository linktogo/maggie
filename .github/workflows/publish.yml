name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      # Nothing here pushes back to GitHub, so the GITHUB_TOKEN is not kept in
      # .git/config alongside a job that handles the npm token.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No `scope:` here on purpose: setup-node writes a registry-wide auth
      # token, which keeps working if a package is ever published under a
      # different scope than the others.
      - uses: pnpm/action-setup@v6 # version from package.json `packageManager`

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Guard: every publishable package (the libraries, the board and the server) must
      # carry the release tag's version (e.g. v0.1.0). They ship in lockstep, so a
      # forgotten bump in one package would publish a broken dependency range.
      - name: Check versions match the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const tag = process.argv[1];
            const bad = [];
            for (const base of ["libs", "apps"]) {
              for (const dir of fs.readdirSync(base)) {
                const pkg = JSON.parse(fs.readFileSync(base + "/" + dir + "/package.json", "utf8"));
                if (pkg.private) continue;
                if (pkg.version !== tag) bad.push(pkg.name + "@" + pkg.version);
              }
            }
            const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (root.version !== tag) bad.push(root.name + "@" + root.version);
            if (bad.length) {
              console.error("release tag is " + tag + " but these do not match: " + bad.join(", "));
              process.exit(1);
            }
            console.log("all publishable packages are at " + tag);
          ' "$tag"

      - run: pnpm test

      # `pnpm -r publish` publishes in dependency order (libraries, @lk/maggie-server, then
      # @lk/maggie-board), skips the private workspace root and any version already on the
      # registry; --no-git-checks because a release checks out a tag, not a branch.
      - name: Publish packages
        run: pnpm -r publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
