name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      # Nothing here pushes back to GitHub, so the GITHUB_TOKEN is not kept in
      # .git/config alongside a job that handles the npm token.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No `scope:` here on purpose: setup-node writes a registry-wide auth
      # token, which keeps working if a package is ever published under a
      # different scope than the others.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Guard: the root package and every publishable library must carry the
      # release tag's version (e.g. v0.1.0). They ship in lockstep, so a
      # forgotten bump in one library would publish a broken dependency range.
      - name: Check versions match the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const tag = process.argv[1];
            const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const bad = [];
            if (root.version !== tag) bad.push(root.name + "@" + root.version);
            for (const dir of fs.readdirSync("libs")) {
              const pkg = JSON.parse(fs.readFileSync("libs/" + dir + "/package.json", "utf8"));
              if (pkg.private) continue;
              if (pkg.version !== tag) bad.push(pkg.name + "@" + pkg.version);
            }
            if (bad.length) {
              console.error("release tag is " + tag + " but these do not match: " + bad.join(", "));
              process.exit(1);
            }
            console.log("all publishable packages are at " + tag);
          ' "$tag"

      - run: npm test

      # Libraries first: the root CLI package depends on them by version range.
      - name: Publish libraries
        run: npm publish --workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
