name: Create release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The GITHUB_TOKEN is not needed after checkout (gh authenticates through
      # GH_TOKEN below), so it is not left behind in .git/config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Extract changelog section for this version
        run: node scripts/extract-changelog-section.js "$GITHUB_REF_NAME" > /tmp/notes.md

      # Uses RELEASE_PAT, not the default GITHUB_TOKEN: GitHub does not fire
      # the "release published" event for releases created by the default
      # token (anti-recursion safeguard), which would silently prevent
      # publish.yml from ever running.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
